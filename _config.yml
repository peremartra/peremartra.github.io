# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Pere Martra # Tu nombre visible en la pestaña del navegador
first_name: Pere
middle_name:
last_name: Martra
contact_note: >
  I offer limited consulting slots for teams needing guidance on LLM Efficiency, RAG Architectures, or Model Pruning.
description: >
  AI Engineer & Researcher. Author of "Large Language Models Projects" (Apress) & "Rearchitecting LLMs" (Manning). Expert in Pruning, Efficiency & Fairness.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.

keywords: ai-engineer, llm, pruning, fairness, manning-author, apress-author, research # Tus keywords estratégicas
lang: en
icon: ⚛️

url: https://peremartra.github.io # Tu URL real
baseurl: "" # IMPRESCINDIBLE: Lo dejo vacío porque es tu página de usuario (root). Si pones algo aquí, se rompe el CSS.
last_updated: false
impressum_path:
back_to_top: true

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# repo color theme
repo_theme_light: default
repo_theme_dark: dark
repo_trophies:
  enabled: true # Muestra tus logros de GitHub (queda muy bien para ingenieros)
  theme_light: flat
  theme_dark: gitdimmed

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: true

# Dimensions
max_width: 930px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
serve_og_meta: false
serve_schema_org: false
og_image:

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------
# Lo dejamos vacío para el MVP. Puedes añadir Google Analytics luego si quieres.
google_analytics:
cronitor_analytics:
pirsch_analytics:
openpanel_analytics:

google_site_verification:
bing_site_verification:

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: Pere Martra's Blog
blog_description: Insights on LLM Optimization, Pruning, and AI Engineering.
permalink: /blog/:year/:title/
lsi: false

# Pagination
pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

# Giscus comments
# Desactivado para el MVP (ahorra tiempo de config)
giscus:
  repo:
  repo_id:
  category: Comments
  category_id:
  mapping: title
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  dark_theme: dark
  light_theme: light
  emit_metadata: 0
  lang: en

# Disqus comments (DEPRECATED)
disqus_shortname:

# External sources.
# He añadido tu feed de Medium para que salga automático si escribes allí.
external_sources:
  - name: medium.com
    rss_url: https://medium.com/feed/@peremartra

# -----------------------------------------------------------------------------
# Newsletter
# -----------------------------------------------------------------------------

newsletter:
  enabled: false
  endpoint:

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  books:
    output: true
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ["_pages", "_scripts"]
exclude:
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - _pages/about_einstein.md
  - purgecss.config.js
  - README.md
  - readme_preview/
  - vendor
keep_files:
  - CNAME
  - .nojekyll

# Plug-ins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jemoji

# Sitemap settings
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed
